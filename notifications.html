<div class="ml-hero"><span class="ml-eyebrow">NOTIFICATIONS</span><h1>Notifications</h1><p>Application, interview, and staff updates will appear here.</p></div>
<div class="ml-card"><div id="notifList"></div></div>
</main><footer class="ml-footer">© 2026 MOON LIGHT RolePlay. All rights reserved.</footer>
<script src="assets/ml.js"></script>
<script src="assets/portal.js"></script>
<script>
let profile={};try{profile=JSON.parse(localStorage.getItem("moon_light_profile_v1")||"{}")}catch(e){}
const myDiscord=(profile.discordUser||"").trim().toLowerCase();
const all=mlGetApps();
const list=myDiscord?mlNotifsFor(myDiscord):(all.length?mlNotifsFor(all[all.length-1].discord):mlGetNotifs().filter(n=>n.toDiscord===null));
const box=document.getElementById("notifList");
box.innerHTML=list.length?list.map(n=>`<div class="ml-alert"><span class="ml-pill">${mlEsc(n.type)}</span><br><b>${mlEsc(n.title)}</b><br>${mlEsc(n.body)}<br><span class="ml-muted">${mlFmt(n.date)}</span></div>`).join(""):`<div class="ml-alert">No notifications yet. Submit an application or check back after staff review your case.</div>`;
</script>
<script>
window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
