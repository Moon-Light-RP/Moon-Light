    </nav></header><main class="ml-container">
<div class="staff-panel-container">
    <div class="staff-panel-header">
        <div>
            <h1 class="staff-panel-title">Police Ranks</h1>
            <p class="staff-panel-subtitle">Ranks are ordered from lowest to highest. This order is used across Members and Promotions.</p>
        </div>
    </div>
<div id="lock" class="role-message loading">Checking permission...</div>
<div id="box" style="display:none;margin-top:16px">
<div class="ml-card">
<h3>Add Rank</h3>
<div class="ml-actions"><input id="newRank" placeholder="New rank name" style="flex:1"><button class="ml-btn primary" onclick="addRank()">Add</button></div>
</div>
<div class="ml-card" style="margin-top:16px"><h3>Current Order (lowest → highest)</h3><div id="rankList"></div></div>
</div>
</div>
</main><footer class="ml-footer">© 2026 MOON LIGHT RolePlay. All rights reserved.</footer>
<script src="assets/portal.js"></script>
<script>
const DEPT="POLICE";
const lock=document.getElementById("lock"), box=document.getElementById("box");

(async function initPoliceRanks(){
  try{
    if(await mlRoleGate(lock,box,"Police","Police Cmd")){
      lock.className="role-message granted";
      lock.innerHTML="Police Ranks access granted.";
      await render();
    }
  }catch(e){
    console.error("Error initializing police ranks:",e);
    lock.className="role-message denied";
    lock.innerHTML="Error loading police ranks: " + e.message + ". Please refresh the page.";
    box.style.display="none";
  }
})();

// Add timeout to detect hanging
setTimeout(() => {
  if(lock.textContent === "Checking permission..."){
    console.error("Police ranks initialization timed out");
    lock.className="role-message denied";
    lock.innerHTML="Police ranks loading timed out. Please refresh the page.";
  }
}, 10000); // 10 second timeout

async function render(){
  const ranks=await mlGetRanks(DEPT);
  const members=await mlDeptMembers(DEPT);
  document.getElementById("rankList").innerHTML=ranks.map((r,i)=>{
    const inUse=members.some(m=>m.rank===r);
    return `<div class="ml-card" style="margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:10px">
      <b>${i+1}. ${mlEsc(r)}</b>
      <div class="ml-actions">
        <button class="ml-btn" ${i===0?"disabled":""} onclick="move(${i},-1)">↑</button>
        <button class="ml-btn" ${i===ranks.length-1?"disabled":""} onclick="move(${i},1)">↓</button>
        <button class="ml-btn danger" ${inUse?"disabled title='In use by a member'":""} onclick="remove(${i})">Remove</button>
      </div>
    </div>`;
  }).join("");
}

const AREA=DEPT==="POLICE"?"Police":"EMS";

async function addRank(){
  const v=document.getElementById("newRank").value.trim();
  if(!v)return;
  const ranks=await mlGetRanks(DEPT);
  if(ranks.includes(v)){alert("Rank already exists.");return}
  ranks.push(v);
  await mlSaveRanks(DEPT,ranks);
  await mlLog(AREA,"Rank added",v,`New order position: ${ranks.length}`);
  document.getElementById("newRank").value="";
  await render();
}

async function move(i,dir){
  const ranks=await mlGetRanks(DEPT);
  const j=i+dir;
  if(j<0||j>=ranks.length)return;
  [ranks[i],ranks[j]]=[ranks[j],ranks[i]];
  await mlSaveRanks(DEPT,ranks);
  await mlLog(AREA,"Rank order changed",ranks[j],`Swapped with ${ranks[i]}`);
  await render();
}

async function remove(i){
  const ranks=await mlGetRanks(DEPT);
  const members=await mlDeptMembers(DEPT);
  if(members.some(m=>m.rank===ranks[i])){alert("Cannot remove a rank currently assigned to a member.");return}
  if(!confirm(`Remove rank "${ranks[i]}"?`))return;
  const name=ranks[i];
  ranks.splice(i,1);
  await mlSaveRanks(DEPT,ranks);
  await mlLog(AREA,"Rank removed",name,"");
  await render();
}
</script>
