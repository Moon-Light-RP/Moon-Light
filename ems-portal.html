<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMS Portal | MOON LIGHT</title><link rel="stylesheet" href="assets/ml-complete.css"><link rel="stylesheet" href="assets/responsive.css"><style>
.staff-panel-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.staff-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.staff-panel-title {
    font-size: 24px;
    font-weight: 700;
    color: #f3f5fb;
    margin: 0;
}

.staff-panel-subtitle {
    color: #94a3b8;
    font-size: 14px;
    margin-top: 5px;
}

.staff-card {
    background: #0c0f17;
    border: 1px solid #1d2331;
    border-radius: 16px;
    padding: 24px;
    transition: all 0.3s ease;
    cursor: pointer;
    text-decoration: none;
    display: block;
    position: relative;
    overflow: hidden;
}

.staff-card:hover {
    border-color: #dc2626;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(220, 38, 38, 0.15);
}

.staff-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #dc2626, #ef4444);
    opacity: 0;
    transition: opacity 0.3s ease;
}

.staff-card:hover::before {
    opacity: 1;
}

.staff-card-icon {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, #7f1d1d, #dc2626);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    font-size: 24px;
}

.staff-card-title {
    font-size: 16px;
    font-weight: 600;
    color: #f3f5fb;
    margin: 0 0 8px 0;
}

.staff-card-description {
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.5;
    margin: 0;
}

.staff-card-arrow {
    position: absolute;
    top: 20px;
    right: 20px;
    color: #64748b;
    font-size: 20px;
    transition: color 0.3s ease;
}

.staff-card:hover .staff-card-arrow {
    color: #f87171;
}

.staff-panel-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
}

.role-message {
    padding: 16px 20px;
    border-radius: 12px;
    margin-bottom: 24px;
    font-size: 14px;
}

.role-message.granted {
    background: rgba(220, 38, 38, 0.1);
    border: 1px solid #dc2626;
    color: #ef4444;
}

.role-message.denied {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid #ef4444;
    color: #f87171;
}

.role-message.loading {
    background: rgba(220, 38, 38, 0.1);
    border: 1px solid #dc2626;
    color: #dc2626;
}
</style></head><body class="ml-page"><header class="ml-nav"><a class="ml-brand" href="index.html"><span class="ml-moon">☾</span> MOON LIGHT</a>
    <nav class="ml-navlinks">
    <a href="index.html">Home</a><a href="rules.html">Rules</a><a href="application.html">Application</a><a href="player.html" class="">My Dashboard</a><a href="police.html">Police</a><a href="ems.html">EMS</a><a href="login.html">Login</a>
    </nav></header><main class="ml-container">
<div class="staff-panel-container">
    <div class="staff-panel-header">
        <div>
            <h1 class="staff-panel-title">EMS Department Portal</h1>
            <p class="staff-panel-subtitle">Internal tools for EMS recruitment, roster, and department management. Not visible to regular players.</p>
        </div>
    </div>
<div id="lock" class="role-message loading">Checking permission...</div>
<div id="box" style="display:none;margin-top:16px" class="staff-panel-grid"></div>
</div>
</main><footer class="ml-footer">© 2026 MOON LIGHT RolePlay. All rights reserved.</footer>
<script src="assets/portal.js"></script>
<script>
const lock=document.getElementById("lock"), box=document.getElementById("box");

const EMS_CARDS=[
 {href:"ems-applications.html",title:"Applications",desc:"Review, interview-flag, accept, or reject EMS applicants.",icon:"📋"},
 {href:"interview-queue.html",title:"Interview Queue",desc:"Schedule and run in-game interviews for approved applicants.",icon:"🎯"},
 {href:"ems-members.html",title:"Members",desc:"View and manage the current EMS roster.",icon:"👥"},
 {href:"ems-ranks.html",title:"Ranks",desc:"Manage the department's rank structure and order.",icon:"📊"},
 {href:"ems-promotions.html",title:"Promotions",desc:"Promote or demote members and review promotion history.",icon:"⬆️"},
 {href:"ems-announcements.html",title:"Announcements & Internal Notices",desc:"Post department announcements and staff-only notices.",icon:"📢"}
];

(async function initEMSPortal(){
  try{
    if(await mlRoleGate(lock,box,"EMS","EMS Cmd")){
      lock.className="role-message granted";
      lock.innerHTML="EMS Portal access granted.";
      
      box.style.display="grid";
      box.innerHTML=EMS_CARDS.map(c=>`
        <a class="staff-card" href="${c.href}">
            <div class="staff-card-icon">${c.icon}</div>
            <span class="staff-card-arrow">→</span>
            <h3 class="staff-card-title">${c.title}</h3>
            <p class="staff-card-description">${c.desc}</p>
        </a>
    `).join("");
    }
  }catch(e){
    console.error("Error initializing EMS portal:",e);
    lock.className="role-message denied";
    lock.innerHTML="Error loading EMS portal: " + e.message + ". Please refresh the page.";
    box.style.display="none";
  }
})();

// Add timeout to detect hanging
setTimeout(() => {
  if(lock.textContent === "Checking permission..."){
    console.error("EMS portal initialization timed out");
    lock.className="role-message denied";
    lock.innerHTML="EMS portal loading timed out. Please refresh the page.";
  }
}, 10000); // 10 second timeout
</script>
</body></html>
