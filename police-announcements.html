    </nav></header><main class="ml-container">
<div class="staff-panel-container">
    <div class="staff-panel-header">
        <div>
            <h1 class="staff-panel-title">Police Announcements</h1>
            <p class="staff-panel-subtitle">Department announcements can be shared with members. Internal notices stay staff-only.</p>
        </div>
    </div>
<div id="lock" class="role-message loading">Checking permission...</div>
<div id="box" style="display:none;margin-top:16px">
<div class="ml-actions"><button class="ml-btn" onclick="setTab('announcements')">Department Announcements</button><button class="ml-btn" onclick="setTab('internal')">Internal Notices (Staff Only)</button></div>
<div class="ml-card" style="margin-top:14px">
<h3 id="formTitle">New Announcement</h3>
<label>Title<input id="nTitle" placeholder="Title"></label>
<label>Author<input id="nAuthor" placeholder="Your name"></label>
<label>Message<textarea id="nBody" placeholder="Write the announcement..."></textarea></label>
<button class="ml-btn primary" onclick="post()">Post</button>
</div>
<div id="list" class="ml-grid" style="margin-top:14px"></div>
</div>
</div>
</main><footer class="ml-footer">© 2026 MOON LIGHT RolePlay. All rights reserved.</footer>
<script src="assets/portal.js"></script>
<script>
const DEPT="POLICE";
const lock=document.getElementById("lock"), box=document.getElementById("box");
let tab="announcements";
(async function initPoliceAnnouncements(){
  try{
    if(await mlRoleGate(lock,box,"Police","Police Cmd")){
      lock.className="role-message granted";
      lock.innerHTML="Police Announcements access granted.";
      render();
    }
  }catch(e){
    console.error("Error initializing police announcements:",e);
    lock.className="role-message denied";
    lock.innerHTML="Error loading police announcements: " + e.message + ". Please refresh the page.";
    box.style.display="none";
  }
})();

// Add timeout to detect hanging
setTimeout(() => {
  if(lock.textContent === "Checking permission..."){
    console.error("Police announcements initialization timed out");
    lock.className="role-message denied";
    lock.innerHTML="Police announcements loading timed out. Please refresh the page.";
  }
}, 10000); // 10 second timeout

function setTab(t){tab=t;document.getElementById("formTitle").textContent=t==="announcements"?"New Announcement":"New Internal Notice";render()}

function post(){
  const title=document.getElementById("nTitle").value.trim();
  const author=document.getElementById("nAuthor").value.trim()||"Staff";
  const body=document.getElementById("nBody").value.trim();
  if(!title||!body){alert("Title and message are required.");return}
  const data=mlGetNotices(DEPT);
  data[tab]=data[tab]||[];
  data[tab].unshift({id:mlUid(),title,author,body,date:new Date().toISOString()});
  mlSaveNotices(DEPT,data);
  mlLog("Police",tab==="announcements"?"Department announcement posted":"Internal notice posted",title,"");
  if(tab==="announcements")mlAddNotification(null,ML_NOTIF_TYPES.STAFF_ANNOUNCEMENT,`Police: ${title}`,body);
  document.getElementById("nTitle").value="";document.getElementById("nBody").value="";
  render();
}

function remove(id){
  const data=mlGetNotices(DEPT);
  data[tab]=(data[tab]||[]).filter(n=>n.id!==id);
  mlSaveNotices(DEPT,data);
  render();
}

function render(){
  const data=mlGetNotices(DEPT);
  const items=data[tab]||[];
  const list=document.getElementById("list");
  list.innerHTML=items.length?items.map(n=>`<article class="ml-card">
    <span class="ml-eyebrow">${mlFmt(n.date)}</span>
    <h3 style="margin-top:8px">${mlEsc(n.title)}</h3>
    <p class="ml-muted">By ${mlEsc(n.author)}</p>
    <p>${mlEsc(n.body)}</p>
    <button class="ml-btn danger" onclick="remove('${n.id}')">Delete</button>
  </article>`).join(""):`<div class="ml-card" style="grid-column:1/-1">Nothing posted yet.</div>`;
}
</script>
</body></html>
