    </nav></header><main class="ml-container">
<div class="staff-panel-container">
    <div class="staff-panel-header">
        <div>
            <h1 class="staff-panel-title">Police Promotions</h1>
            <p class="staff-panel-subtitle">Promote or demote a member and keep a record of every rank change.</p>
        </div>
    </div>
<div id="lock" class="role-message loading">Checking permission...</div>
<div id="box" style="display:none;margin-top:16px">
<div class="ml-card">
<h3>Change Rank</h3>
<div class="ml-grid">
<label>Member<select id="pMember"></select></label>
<label>New Rank<select id="pRank"></select></label>
</div>
<label>Note<textarea id="pNote" placeholder="Reason for this rank change (optional)"></textarea></label>
<button class="ml-btn primary" onclick="applyPromotion()">Apply Change</button>
<div id="result" class="ml-alert" style="display:none"></div>
</div>
<div class="ml-card" style="margin-top:16px"><h3>Promotion History</h3><div id="history"></div></div>
</div>
</div>
</main><footer class="ml-footer">© 2026 MOON LIGHT RolePlay. All rights reserved.</footer>
<script src="assets/portal.js"></script>
<script>
const DEPT="POLICE";
const lock=document.getElementById("lock"), box=document.getElementById("box");
(async function initPolicePromotions(){
  try{
    if(await mlRoleGate(lock,box,"Police","Police Cmd")){
      lock.className="role-message granted";
      lock.innerHTML="Police Promotions access granted.";
      await render();
    }
  }catch(e){
    console.error("Error initializing police promotions:",e);
    lock.className="role-message denied";
    lock.innerHTML="Error loading police promotions: " + e.message + ". Please refresh the page.";
    box.style.display="none";
  }
})();

// Add timeout to detect hanging
setTimeout(() => {
  if(lock.textContent === "Checking permission..."){
    console.error("Police promotions initialization timed out");
    lock.className="role-message denied";
    lock.innerHTML="Police promotions loading timed out. Please refresh the page.";
  }
}, 10000); // 10 second timeout

async function render(){
  const members=await mlDeptMembers(DEPT);
  const ranks=await mlGetRanks(DEPT);
  document.getElementById("pMember").innerHTML=members.length?members.map((m,i)=>`<option value="${i}">${mlEsc(m.name)} — ${mlEsc(m.rank)}</option>`).join(""):`<option value="">No members</option>`;
  document.getElementById("pRank").innerHTML=ranks.map(r=>`<option>${mlEsc(r)}</option>`).join("");

  let rows=[];
  members.forEach(m=>(m.promotions||[]).forEach(p=>rows.push({m,p})));
  rows.sort((a,b)=>new Date(b.p.date)-new Date(a.p.date));
  document.getElementById("history").innerHTML=rows.length?`<table class="ml-table"><tbody><tr><th>Member</th><th>From</th><th>To</th><th>Date</th><th>Note</th></tr>${rows.map(({m,p})=>`<tr><td>${mlEsc(m.name)}</td><td>${mlEsc(p.from)}</td><td>${mlEsc(p.to)}</td><td>${mlFmt(p.date)}</td><td>${mlEsc(p.note||"—")}</td></tr>`).join("")}</tbody></table>`:`<div class="ml-muted">No promotions recorded yet.</div>`;
}

const AREA=DEPT==="POLICE"?"Police":"EMS";

async function applyPromotion(){
  const members=await mlDeptMembers(DEPT);
  const idx=Number(document.getElementById("pMember").value);
  if(isNaN(idx)||!members[idx]){alert("Select a member first.");return}
  const newRank=document.getElementById("pRank").value;
  const note=document.getElementById("pNote").value.trim();
  const m=members[idx];
  if(m.rank===newRank){alert("Member already holds this rank.");return}
  const fromRank=m.rank;
  m.promotions=m.promotions||[];
  m.promotions.push({date:new Date().toISOString(),from:m.rank,to:newRank,note});
  m.rank=newRank;
  await mlSaveDeptMembers(DEPT,members);
  await mlLog(AREA,`Rank change: ${fromRank} → ${newRank}`,m.name,note||"");
  document.getElementById("pNote").value="";
  const r=document.getElementById("result");r.style.display="block";r.textContent=`${m.name} is now ${newRank}.`;
  await render();
}
</script>
</body></html>
