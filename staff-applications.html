<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Panel — Applications | MOON LIGHT</title><link rel="stylesheet" href="assets/ml-complete.css"><link rel="stylesheet" href="assets/responsive.css"><style>
.staff-panel-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px;
}

.staff-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid #1d2331;
}

.staff-panel-title {
    font-size: 24px;
    font-weight: 700;
    color: #f3f5fb;
    margin: 0;
}

.staff-panel-subtitle {
    color: #94a3b8;
    font-size: 14px;
    margin-top: 5px;
}

.role-message {
    padding: 16px 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    font-size: 14px;
    backdrop-filter: blur(10px);
}

.role-message.granted {
    background: rgba(220, 38, 38, 0.1);
    border: 1px solid #dc2626;
    color: #ef4444;
}

.role-message.denied {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid #ef4444;
    color: #f87171;
}

.role-message.loading {
    background: rgba(220, 38, 38, 0.1);
    border: 1px solid #dc2626;
    color: #dc2626;
}

.search-wrapper {
    position: relative;
    flex: 2;
    min-width: 220px;
}

.search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #64748b;
    pointer-events: none;
}

.search-input {
    width: 100%;
    padding: 12px 14px 12px 42px;
    background: #0b0e15;
    border: 1px solid #252b3a;
    border-radius: 10px;
    color: #f3f5fb;
    font-size: 13px;
    outline: none;
    transition: all 0.2s ease;
    font-family: inherit;
}

.search-input::placeholder {
    color: #64748b;
}

.search-input:focus {
    border-color: #dc2626;
    box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.10);
}

.filter-section {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #1d2331;
}

.filter-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
}

.filter-row:last-child {
    margin-bottom: 0;
}

.filter-label {
    color: #94a3b8;
    font-size: 12px;
    font-weight: 600;
    min-width: 80px;
}

.filter-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.filter-buttons .ml-btn {
    padding: 8px 14px;
    font-size: 11px;
    transition: all 0.2s ease;
}

.filter-buttons .ml-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
}

.filter-buttons .ml-btn.primary {
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    border-color: #ef4444;
    color: #ffffff;
}

.filter-buttons .ml-btn.danger {
    background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
    border-color: #dc2626;
    color: #fecaca;
}

.filter-buttons .ml-btn.active {
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    border-color: #ef4444;
    color: #ffffff;
    box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.3);
}

.application-card {
    background: linear-gradient(145deg, #0d1018 0%, #0e131c 100%);
    border: 1px solid #202638;
    border-radius: 12px;
    padding: 20px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.application-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #dc2626, transparent);
    opacity: 0;
    transition: opacity 0.3s ease;
}

.application-card:hover::before {
    opacity: 1;
}

.application-card:hover {
    transform: translateY(-2px);
    border-color: #2a3347;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
}

.application-card h3 {
    margin: 0 0 8px;
    font-size: 15px;
    color: #f3f5fb;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
}

.application-card .ml-pill {
    margin-top: 0;
    background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 100%);
    border: 1px solid #dc2626;
    padding: 4px 10px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.5px;
}

.app-meta {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.app-meta span {
    font-size: 10px;
    color: #94a3b8;
    background: #1a1f2e;
    border: 1px solid #252b3a;
    border-radius: 20px;
    padding: 6px 10px;
    font-weight: 500;
}

.review-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
}

.review-actions .ml-btn {
    padding: 8px 12px;
    font-size: 10px;
    font-weight: 600;
    transition: all 0.2s ease;
}

.review-actions .ml-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
}

.ml-card {
    background: linear-gradient(145deg, #0c0f17 0%, #0d1018 100%);
    border: 1px solid #1d2331;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    transition: all 0.3s ease;
}

.ml-card:hover {
    border-color: #252b3a;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
}
</style><script type="module" src="assets/speed-insights-init.js"></script>
</head><body class="ml-page"><header class="ml-nav"><a class="ml-brand" href="index.html"><span class="ml-moon">☾</span> MOON LIGHT</a><nav class="ml-navlinks"><a href="index.html">Home</a><a href="rules.html">Rules</a><a href="application.html">Application</a><a href="player.html">Dashboard</a><a href="police.html">Police</a><a href="ems.html">EMS</a><a href="login.html">Login</a></nav></header><main class="ml-container">
<div class="staff-panel-container">
    <div class="staff-panel-header">
        <div>
            <h1 class="staff-panel-title">Applications</h1>
            <p class="staff-panel-subtitle">Search and filter every application across Civilian, Police, and EMS. Your view is automatically scoped to your permissions.</p>
        </div>
    </div>
<div id="lock" class="role-message loading">Checking permission...</div>
<div id="box" style="display:none;margin-top:16px">
<div class="ml-card">
<div class="ml-actions">
<div class="search-wrapper">
  <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"></circle>
    <path d="m21 21-4.35-4.35"></path>
  </svg>
  <input id="search" placeholder="Search applicant name or Discord..." class="search-input" oninput="render()">
</div>
</div>
<div class="filter-section">
<div class="filter-row">
<span class="filter-label">Status:</span>
<div class="filter-buttons">
<button class="ml-btn" onclick="setStatus('all')">All</button>
<button class="ml-btn" onclick="setStatus('pending')">Pending</button>
<button class="ml-btn" onclick="setStatus('under_review')">Under Review</button>
<button class="ml-btn" onclick="setStatus('interview')">Interview</button>
<button class="ml-btn primary" onclick="setStatus('accepted')">Approved</button>
<button class="ml-btn danger" onclick="setStatus('rejected')">Rejected</button>
</div>
</div>
<div class="filter-row" id="deptFilters">
<span class="filter-label">Department:</span>
<div class="filter-buttons">
<button class="ml-btn" onclick="setDept('all')">All</button>
<button class="ml-btn" onclick="setDept('CIVILIAN')">Civilian</button>
<button class="ml-btn" onclick="setDept('POLICE')">Police</button>
<button class="ml-btn" onclick="setDept('EMS')">EMS</button>
</div>
</div>
</div>
</div>
<div id="list" class="ml-grid" style="margin-top:16px"></div>
</div>
</div>
</main><footer class="ml-footer">© 2026 MOON LIGHT RolePlay. All rights reserved.</footer>
<script src="assets/portal.js"></script>
<script>
const lock=document.getElementById("lock"), box=document.getElementById("box");
let statusFilter="all", deptFilter="all", searchTerm="";

// Also check role name for Management
async function isManagement(){
  try{
    const roleName=await mlGetRoleName();
    return roleName==="Management";
  }catch(e){
    console.error('Error checking management role:', e);
    return false;
  }
}

/* Work out which departments this viewer is allowed to see. */
async function allowedDepts(){
  try{
    // First check if user is logged in
    const identity = await mlGetIdentity();
    if(!identity || !identity.discordId){
      console.log('No identity found, returning empty departments');
      return [];
    }
    
    const roleId=await mlRole();
    const roleName=await mlGetRoleName();
    
    console.log('allowedDepts:', { roleId, roleName, identity });
    
    // Management gets everything
    if(roleName==="Management" || await isManagement()){
      console.log('Management role detected, returning all departments');
      return["CIVILIAN","POLICE","EMS"];
    }
    
    const d=[];
    try{
      if(await mlHasPerm("Applications"))d.push("CIVILIAN");
    }catch(e){
      console.log('Could not check Applications permission:', e);
    }
    try{
      if(await mlHasPerm("police.view"))d.push("POLICE");
    }catch(e){
      console.log('Could not check police.view permission:', e);
    }
    try{
      if(await mlHasPerm("ems.view"))d.push("EMS");
    }catch(e){
      console.log('Could not check ems.view permission:', e);
    }
    
    // Fallback: if logged in but no permissions, show at least civilian
    if(d.length===0){
      console.log('No permissions found, adding CIVILIAN as fallback');
      d.push("CIVILIAN");
    }
    
    console.log('Allowed departments:', d);
    return d;
  }catch(e){
    console.error("Error in allowedDepts:",e);
    return [];
  }
}

async function checkAccess(){
  try{
    const depts=await allowedDepts();
    const roleId=await mlRole();
    const roleName=await mlGetRoleName();
    
    console.log('checkAccess:', { depts, roleId, roleName });
    
    if(depts.length){
      lock.className="role-message granted";
      lock.innerHTML=`Access granted — showing: ${depts.map(d=>d==="CIVILIAN"?"Civilian":d).join(", ")}. Your role: <b>${roleName||"Player"}</b>`;
      box.style.display="block";
      document.getElementById("deptFilters").style.display=depts.length>1?"flex":"none";
      return true;
    }
    lock.className="role-message denied";
    lock.innerHTML=`Access denied. Your role doesn't have access to any application queue. Your role: <b>${roleName||"Player"}</b>`;
    box.style.display="none";
    return false;
  }catch(e){
    console.error("Error in checkAccess:",e);
    lock.className="role-message denied";
    lock.innerHTML="Error checking access: " + e.message + ". Please refresh the page.";
    box.style.display="none";
    return false;
  }
}

function setStatus(s){statusFilter=s;render();updateFilterButtons()}
function setDept(d){deptFilter=d;render();updateFilterButtons()}

function updateFilterButtons(){
  // Update status buttons
  const statusButtons = document.querySelectorAll('.filter-row:first-child .ml-btn');
  statusButtons.forEach(btn => {
    const btnStatus = btn.textContent.toLowerCase().replace(' ', '_');
    if(btnStatus === statusFilter || (btnStatus === 'approved' && statusFilter === 'accepted') || (btnStatus === 'all' && statusFilter === 'all')){
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });

  // Update department buttons
  const deptButtons = document.querySelectorAll('#deptFilters .ml-btn');
  deptButtons.forEach(btn => {
    const btnDept = btn.textContent.toUpperCase();
    if(btnDept === deptFilter || (btnDept === 'ALL' && deptFilter === 'all')){
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });
}

async function render(){
  if(!(await checkAccess()))return;
  searchTerm=document.getElementById("search").value.trim().toLowerCase();
  const depts=await allowedDepts();
  
  console.log('render:', { depts, deptFilter, statusFilter, searchTerm });
  
  let all=[];
  try{
    all=await mlGetApps();
    console.log('Got applications:', all.length);
  }catch(e){
    console.error('Error fetching applications:', e);
    document.getElementById("list").innerHTML=`<div class="ml-card" style="grid-column:1/-1">Error loading applications: ${e.message}</div>`;
    return;
  }
  
  let rows=all.map((a,i)=>({a,i})).filter(x=>depts.includes(x.a.type));
  if(deptFilter!=="all")rows=rows.filter(x=>x.a.type===deptFilter);
  if(statusFilter!=="all")rows=rows.filter(x=>(x.a.status||"pending")===statusFilter);
  if(searchTerm)rows=rows.filter(x=>(x.a.character_name||"").toLowerCase().includes(searchTerm)||(x.a.discord_username||"").toLowerCase().includes(searchTerm));

  const list=document.getElementById("list");
  if(!rows.length){list.innerHTML=`<div class="ml-card" style="grid-column:1/-1">No applications match this view.</div>`;return}
  list.innerHTML=rows.map(({a,i})=>`<article class="application-card">
    <h3>${mlEsc(a.character_name)||"Unknown"} <span class="ml-pill">${a.type==="CIVILIAN"?"Civilian":mlEsc(a.type)}</span></h3>
    <p class="ml-muted">${mlEsc(a.discord_username)||"No Discord"}</p>
    <div class="app-meta"><span>${mlEsc(a.experience||"—")}</span><span>${mlEsc(a.created_at?new Date(a.created_at).toLocaleDateString():"—")}</span><span class="ml-status ${a.status||"pending"}">${mlEsc(a.status||"pending")}</span></div>
    ${a.assigned_to?`<div class="ml-muted" style="margin-top:8px;font-size:10px">Assigned to: <strong>${mlEsc(a.assigned_to)}</strong></div>`:""}
    <div class="review-actions">
      <button class="ml-btn" onclick="assignApp(${i})">Assign</button>
      <button class="ml-btn" onclick="setAppStatus(${i},'under_review')">Under Review</button>
      <button class="ml-btn" onclick="setAppStatus(${i},'interview')">Interview</button>
      <button class="ml-btn primary" onclick="setAppStatus(${i},'accepted')">Accept</button>
      <button class="ml-btn danger" onclick="setAppStatus(${i},'rejected')">Reject</button>
    </div>
  </article>`).join("");
}

async function setAppStatus(i,status){
  const all=await mlGetApps();
  const a=all[i];
  if(!a)return;
  const area=a.type==="CIVILIAN"?"Applications":a.type;
  if(!(await mlHasPerm(area))){alert("You don't have permission to update this application.");return}
  
  // Update status via API
  try{
    const response=await fetch(`/api/applications/${a.id}/status`,{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({status})
    });
    const data=await response.json();
    if(data.ok){
      const deptName=a.type==="CIVILIAN"?"Civilian":a.type;
      if(status==="accepted"){
        await mlAddNotification(a.discord,ML_NOTIF_TYPES.APPROVED,`${deptName} application approved`,`Your ${deptName} application has been approved.`);
        await mlAddNotification(a.discord,ML_NOTIF_TYPES.DEPT_ACCEPTED,`Welcome to ${deptName}`,`You are now accepted into ${deptName}.`);
      }else if(status==="rejected"){
        await mlAddNotification(a.discord,ML_NOTIF_TYPES.REJECTED,`${deptName} application rejected`,`Your ${deptName} application was not accepted this time.`);
      }
      await render();
    }else{
      alert("Failed to update status: "+data.error);
    }
  }catch(e){
    alert("Error updating status: "+e.message);
  }
}

async function assignApp(i){
  const all=await mlGetApps();
  const a=all[i];
  if(!a)return;
  
  const staffUsername=prompt("Enter staff username to assign this application:");
  if(!staffUsername)return;
  
  try{
    const response=await fetch(`/api/applications/${a.id}/assign`,{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({assigned_to:staffUsername})
    });
    const data=await response.json();
    if(data.ok){
      alert("Application assigned successfully!");
      await render();
    }else{
      alert("Failed to assign: "+data.error);
    }
  }catch(e){
    alert("Error assigning application: "+e.message);
  }
}

(async function initStaffApplications(){
  try{
    console.log('Initializing staff applications...');
    const hasAccess = await checkAccess();
    console.log('Has access:', hasAccess);
    if(hasAccess){
      await render();
      updateFilterButtons();
    }
  }catch(e){
    console.error("Error initializing staff applications:",e);
    lock.className="role-message denied";
    lock.innerHTML="Error loading applications: " + e.message + ". Please refresh the page.";
    box.style.display="none";
  }
})();

// Add timeout to detect hanging
setTimeout(() => {
  if(lock.textContent === "Checking permission..."){
    console.error("Staff applications initialization timed out");
    lock.className="role-message denied";
    lock.innerHTML="Applications loading timed out. Please refresh the page.";
  }
}, 10000); // 10 second timeout
</script>
</body></html>
