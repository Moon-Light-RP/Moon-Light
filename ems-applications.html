<div class="staff-panel-container">
    <div class="staff-panel-header">
        <div>
            <h1 class="staff-panel-title">EMS Applications</h1>
            <p class="staff-panel-subtitle">Only staff with EMS Cmd (or Management) permission can review these.</p>
        </div>
    </div>
<div id="lock" class="role-message loading">Checking permission...</div>
<div id="apps" style="display:none;margin-top:16px"><div class="ml-actions"><button class="ml-btn" onclick="filterApps('all')">All</button><button class="ml-btn" onclick="filterApps('pending')">Pending</button><button class="ml-btn" onclick="filterApps('interview')">Interview</button><button class="ml-btn" onclick="filterApps('accepted')">Accepted</button><button class="ml-btn danger" onclick="filterApps('rejected')">Rejected</button><a class="ml-btn" href="interview-queue.html">Interview Queue →</a><a class="ml-btn" href="ems-portal.html">EMS Portal →</a></div><div id="list" class="ml-grid"></div>
</div>
</div>
</main><footer class="ml-footer">© 2026 MOON LIGHT RolePlay. All rights reserved.</footer>
<script src="assets/portal.js"></script>
<script>
const lock=document.getElementById("lock"), appsBox=document.getElementById("apps");
(async function initEMSApps(){
  try{
    if(await mlRoleGate(lock,appsBox,"EMS","EMS Cmd")){
      lock.className="role-message granted";
      lock.innerHTML="EMS Applications access granted.";
      await render("all");
    }
  }catch(e){
    console.error("Error initializing EMS applications:",e);
    lock.className="role-message denied";
    lock.innerHTML="Error loading EMS applications: " + e.message + ". Please refresh the page.";
    appsBox.style.display="none";
  }
})();

// Add timeout to detect hanging
setTimeout(() => {
  if(lock.textContent === "Checking permission..."){
    console.error("EMS applications initialization timed out");
    lock.className="role-message denied";
    lock.innerHTML="EMS applications loading timed out. Please refresh the page.";
  }
}, 10000); // 10 second timeout

async function render(filter){
  const all=await mlGetApps();
  const list=all.filter(a=>a.type==="EMS").filter(a=>filter==="all"||a.status===filter);
  document.getElementById("list").innerHTML=list.length?list.map(a=>{
    const i=all.indexOf(a);
    return `<article class="application-card"><h3>${mlEsc(a.characterName)||"Unknown"}</h3><p class="ml-muted">${mlEsc(a.discord)||"No Discord"}</p><div class="app-meta"><span>${mlEsc(a.experience||"—")}</span><span>${mlEsc(a.submitted||"—")}</span><span class="ml-status ${a.status||"pending"}">${mlEsc(a.status||"pending")}</span></div><div class="review-actions"><button class="ml-btn" onclick="setStatus(${i},'interview')">Interview</button><button class="ml-btn primary" onclick="setStatus(${i},'accepted')">Accept</button><button class="ml-btn danger" onclick="setStatus(${i},'rejected')">Reject</button></div></article>`;
  }).join(""):`<div class="ml-card" style="grid-column:1/-1">No EMS applications found.</div>`;
}
function filterApps(x){render(x)}
async function setStatus(i,status){
  const all=await mlGetApps();const a=all[i];if(!a)return;
  const prev=a.status||"pending";
  a.status=status;await mlSaveApps(all);
  if(status==="accepted"){await mlAddNotification(a.discord,ML_NOTIF_TYPES.APPROVED,"EMS application approved","Your EMS application has been approved.");await mlAddNotification(a.discord,ML_NOTIF_TYPES.DEPT_ACCEPTED,"Welcome to EMS","You are now accepted into the EMS department.")}
  else if(status==="rejected")await mlAddNotification(a.discord,ML_NOTIF_TYPES.REJECTED,"EMS application rejected","Your EMS application was not accepted this time.");
  await mlLog("EMS",`Status changed: ${prev} → ${status}`,a.characterName||"Unknown",`Discord: ${a.discord||"—"}`);
  await render("all");
}
</script>
