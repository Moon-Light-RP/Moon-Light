    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.staff-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.staff-panel-title {
    font-size: 24px;
    font-weight: 700;
    color: #f3f5fb;
    margin: 0;
}

.staff-panel-subtitle {
    color: #94a3b8;
    font-size: 14px;
    margin-top: 5px;
}

.role-message {
    padding: 16px 20px;
    border-radius: 12px;
    margin-bottom: 24px;
    font-size: 14px;
}

.role-message.granted {
    background: rgba(220, 38, 38, 0.1);
    border: 1px solid #dc2626;
    color: #ef4444;
}

.role-message.denied {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid #ef4444;
    color: #f87171;

.role-message.loading {
    background: rgba(220, 38, 38, 0.1);
    border: 1px solid #dc2626;
    color: #dc2626;
}
</style></head><body class="ml-page"><header class="ml-nav"><a class="ml-brand" href="index.html"><span class="ml-moon">☾</span> MOON LIGHT</a>
    <nav class="ml-navlinks">
    <a href="index.html">Home</a><a href="rules.html">Rules</a><a href="store.html">Store</a><a href="application.html">Application</a><a href="player.html" class="">My Dashboard</a><a href="police.html">Police</a><a href="ems.html">EMS</a><a href="login.html">Login</a>
    </nav></header><main class="ml-container">
<div class="staff-panel-container">
    <div class="staff-panel-header">
        <div>
            <h1 class="staff-panel-title">Interview Queue</h1>
            <p class="staff-panel-subtitle">Applications approved for interview move here. Schedule a time and interviewer, then run the interview.</p>
        </div>
    </div>
<div id="lock" class="role-message loading">Checking permission...</div>
<div id="box" style="display:none;margin-top:16px">
<div class="ml-actions">
  <button class="ml-btn" id="tabAwaiting" onclick="setTab('awaiting')">Awaiting Schedule</button>
  <button class="ml-btn" id="tabScheduled" onclick="setTab('scheduled')">Scheduled</button>
  <button class="ml-btn" id="tabHistory" onclick="setTab('history')">Interview History</button>
</div>
<div id="list" class="ml-grid" style="margin-top:14px"></div>
</div>
</div>
</main><footer class="ml-footer">© 2026 MOON LIGHT RolePlay. All rights reserved.</footer>
<script src="assets/portal.js"></script>
<script>
const lock=document.getElementById("lock"), box=document.getElementById("box");
let tab="awaiting";

async function allowedDepts(){
  const role=await mlRole();
  if(role==="Management")return["CIVILIAN","POLICE","EMS"];
  const d=[];
  if(await mlHasPerm("Applications"))d.push("CIVILIAN");
  if(await mlHasPerm("Police"))d.push("POLICE");
  if(await mlHasPerm("EMS"))d.push("EMS");
  return d;
}
async function checkAccess(){
  try{
    const depts=await allowedDepts();
    const role=await mlRole();
    if(depts.length){lock.className="role-message granted";lock.innerHTML=`Access granted — showing: ${depts.join(", ")}. Your role: <b>${role||"No staff role"}</b>`;box.style.display="block";return true}
    lock.className="role-message denied";
    lock.innerHTML=`Access denied. Your role: <b>${role||"No staff role"}</b>`;box.style.display="none";return false;
  }catch(e){
    console.error("Error in checkAccess:",e);
    lock.className="role-message denied";
    lock.innerHTML="Error checking access: " + e.message;
    box.style.display="none";
    return false;
  }
}
function setTab(t){
  tab=t;
  document.getElementById("tabAwaiting").className=t==='awaiting'?'ml-btn primary':'ml-btn';
  document.getElementById("tabScheduled").className=t==='scheduled'?'ml-btn primary':'ml-btn';
  document.getElementById("tabHistory").className=t==='history'?'ml-btn primary':'ml-btn';
  render();
}

async function render(){
  if(!(await checkAccess()))return;
  const depts=await allowedDepts();
  const all=await mlGetApps();
  let rows=[];
  if(tab==="history"){
    rows=all.filter(a=>depts.includes(a.type)&&(a.status==="accepted"||a.status==="rejected"));
  }else if(tab==="scheduled"){
    rows=all.filter(a=>a.status==="interview"&&depts.includes(a.type)&&(a.interview_scheduled_at||a.interview?.scheduled));
  }else{
    rows=all.filter(a=>a.status==="interview"&&depts.includes(a.type)&&!(a.interview_scheduled_at||a.interview?.scheduled));
  }
  const list=document.getElementById("list");
  if(!rows.length){list.innerHTML=`<div class="ml-card" style="grid-column:1/-1">No applications in this view.</div>`;return}
  list.innerHTML=rows.map(a=>{
    const charName = a.character_name || a.characterName || "Unknown";
    const discordName = a.discord_username || a.discord || "No Discord";
    const appDate = a.created_at ? mlFmt(a.created_at) : (a.submitted || "—");
    const sched = a.interview?.scheduled;
    const schedTime = a.interview_scheduled_at || sched?.datetime;
    const interviewer = sched?.interviewer || "Assigned Staff";
    return `<article class="application-card">
      <h3>${mlEsc(charName)} <span class="ml-pill">${a.type==="CIVILIAN"?"Civilian":mlEsc(a.type)}</span></h3>
      <p class="ml-muted">${mlEsc(discordName)} · ${mlEsc(a.experience||"—")}</p>
      <div class="app-meta"><span>Submitted: ${mlEsc(appDate)}</span><span class="ml-status ${a.status}">${mlEsc(a.status)}</span></div>
      ${schedTime?`<div class="ml-alert">Scheduled with <b>${mlEsc(interviewer)}</b> at <b>${mlFmt(schedTime)}</b></div>`:""}
      
      ${tab==="history"?`<div class="ml-muted" style="margin-top:10px">Status: <b>${mlEsc(a.status)}</b></div>`:""}

      ${tab==="scheduled"?`
      <div class="ml-actions" style="margin-top:12px">
        <button class="ml-btn primary" onclick="completeInterview('${a.id}','accepted')">Pass Interview ✓</button>
        <button class="ml-btn danger" onclick="completeInterview('${a.id}','rejected')">Fail Interview ✕</button>
        <button class="ml-btn" onclick="toggleForm('${a.id}')">Reschedule</button>
      </div>`:""}

      ${tab==="awaiting"?`
      <div class="ml-actions" style="margin-top:12px">
        <button class="ml-btn primary" onclick="toggleForm('${a.id}')">Schedule Interview</button>
      </div>`:""}

      <div id="form-${a.id}" style="display:none;margin-top:10px;padding:12px;border:1px solid #1e293b;border-radius:8px">
        <label>Interviewer<input id="int-${a.id}" placeholder="Staff name" value="${mlEsc(sched?.interviewer||"")}"></label>
        <label>Date & time<input id="dt-${a.id}" type="datetime-local" value="${schedTime?schedTime.slice(0,16):""}"></label>
        <label>Notes<textarea id="note-${a.id}" placeholder="Optional scheduling notes...">${mlEsc(sched?.notes||"")}</textarea></label>
        <button class="ml-btn primary" style="margin-top:8px" onclick="schedule('${a.id}')">Save Schedule</button>
      </div>
    </article>`;
  }).join("");
}

function toggleForm(id){const f=document.getElementById("form-"+id);f.style.display=f.style.display==="none"?"block":"none"}

async function schedule(id){
  const interviewer=document.getElementById("int-"+id).value.trim();
  const datetime=document.getElementById("dt-"+id).value;
  const notes=document.getElementById("note-"+id).value.trim();
  if(!interviewer||!datetime){alert("Interviewer and date/time are required.");return}
  const all=await mlGetApps();
  const a=all.find(x=>String(x.id)===String(id));
  if(!a)return;
  a.interview=a.interview||{history:[]};
  a.interview.scheduled={interviewer,datetime,notes};
  a.interview_scheduled_at=datetime;
  const dept=a.type==="CIVILIAN"?"Civilian":a.type;
  const discordTarget=a.discord_id||a.discord_username||a.discord;
  const charName=a.character_name||a.characterName||"Unknown";
  await mlAddNotification(discordTarget,ML_NOTIF_TYPES.INTERVIEW_SCHEDULED,`${dept} interview scheduled`,`Your ${dept} interview is scheduled for ${mlFmt(datetime)} with ${interviewer}.`);
  await mlLog(a.type==="CIVILIAN"?"Applications":a.type,"Interview scheduled",charName,`${mlFmt(datetime)} with ${interviewer}`);
  alert("Interview scheduled successfully!");
  await render();
}

async function completeInterview(id,result){
  const notes=prompt(`Enter notes for marking this interview as ${result.toUpperCase()}:`) || "";
  const all=await mlGetApps();
  const a=all.find(x=>String(x.id)===String(id));
  if(!a)return;
  const dept=a.type==="CIVILIAN"?"Civilian":a.type;
  const discordTarget=a.discord_id||a.discord_username||a.discord;
  const charName=a.character_name||a.characterName||"Unknown";
  
  const res=await mlUpdateAppStatus(a.id,result);
  if(res && res.ok!==false){
    if(result==="accepted"){
      await mlAddNotification(discordTarget,ML_NOTIF_TYPES.APPROVED,`${dept} Application Passed`,`Congratulations! You passed your interview and have been accepted into ${dept}.`);
    }else{
      await mlAddNotification(discordTarget,ML_NOTIF_TYPES.REJECTED,`${dept} Interview Result`,`Your interview was not successful this time. Notes: ${notes}`);
    }
    await mlLog(a.type==="CIVILIAN"?"Applications":a.type,`Interview result: ${result}`,charName,notes);
    alert(`Interview marked as ${result}.`);
    await render();
  }else{
    alert("Error updating status: "+(res?.error||"Unknown error"));
  }
}

(async function initInterviewQueue(){
  try{
    if(await checkAccess()) await render();
  }catch(e){
    console.error("Error initializing interview queue:",e);
    lock.className="role-message denied";
    lock.innerHTML="Error loading interview queue: " + e.message + ". Please refresh the page.";
    box.style.display="none";
  }
})();

// Add timeout to detect hanging
setTimeout(() => {
  if(lock.textContent === "Checking permission..."){
    console.error("Interview queue initialization timed out");
    lock.className="role-message denied";
    lock.innerHTML="Interview queue loading timed out. Please refresh the page.";
  }
}, 10000); // 10 second timeout
</script>
</body></html>
