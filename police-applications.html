<div class="staff-panel-container">
    <div class="staff-panel-header">
        <div>
            <h1 class="staff-panel-title">Police Applications</h1>
            <p class="staff-panel-subtitle">Only staff with Police Cmd (or Management) permission can review these.</p>
        </div>
    </div>
<div id="lock" class="role-message loading">Checking permission...</div>
<div id="apps" style="display:none;margin-top:16px"><div class="ml-actions"><button class="ml-btn" onclick="filterApps('all')">All</button><button class="ml-btn" onclick="filterApps('pending')">Pending</button><button class="ml-btn" onclick="filterApps('interview')">Interview</button><button class="ml-btn" onclick="filterApps('accepted')">Accepted</button><button class="ml-btn danger" onclick="filterApps('rejected')">Rejected</button><a class="ml-btn" href="interview-queue.html">Interview Queue →</a><a class="ml-btn" href="police-portal.html">Police Portal →</a></div><div id="list" class="ml-grid"></div>
</div>
</div>
</main><footer class="ml-footer">© 2026 MOON LIGHT RolePlay. All rights reserved.</footer>
<script src="assets/portal.js"></script>
<script>
const lock=document.getElementById("lock"), appsBox=document.getElementById("apps");
(async function initPoliceApps(){
  try{
    if(await mlRoleGate(lock,appsBox,"Police","Police Cmd")){
      lock.className="role-message granted";
      lock.innerHTML="Police Applications access granted.";
      await render("all");
    }
  }catch(e){
    console.error("Error initializing police applications:",e);
    lock.className="role-message denied";
    lock.innerHTML="Error loading police applications: " + e.message + ". Please refresh the page.";
    appsBox.style.display="none";
  }
})();

// Add timeout to detect hanging
setTimeout(() => {
  if(lock.textContent === "Checking permission..."){
    console.error("Police applications initialization timed out");
    lock.className="role-message denied";
    lock.innerHTML="Police applications loading timed out. Please refresh the page.";
  }
}, 10000); // 10 second timeout

async function render(filter){
  const all=await mlGetApps();
  const list=all.filter(a=>a.type==="POLICE").filter(a=>filter==="all"||a.status===filter);
  document.getElementById("list").innerHTML=list.length?list.map(a=>{
    const charName = a.character_name || a.characterName || "Unknown";
    const discordName = a.discord_username || a.discord || "No Discord";
    const appDate = a.created_at ? mlFmt(a.created_at) : (a.submitted || "—");
    return `<article class="application-card">
      <h3>${mlEsc(charName)}</h3>
      <p class="ml-muted">${mlEsc(discordName)}</p>
      <div class="app-meta">
        <span>${mlEsc(a.experience||"—")}</span>
        <span>${mlEsc(appDate)}</span>
        <span class="ml-status ${a.status||"pending"}">${mlEsc(a.status||"pending")}</span>
      </div>
      <div class="review-actions">
        <button class="ml-btn" onclick="setStatus('${a.id}','interview')">Interview</button>
        <button class="ml-btn primary" onclick="setStatus('${a.id}','accepted')">Accept</button>
        <button class="ml-btn danger" onclick="setStatus('${a.id}','rejected')">Reject</button>
      </div>
    </article>`;
  }).join(""):`<div class="ml-card" style="grid-column:1/-1">No Police applications found.</div>`;
}
function filterApps(x){render(x)}
async function setStatus(id,status){
  const all=await mlGetApps();
  const a=all.find(x=>String(x.id)===String(id));
  if(!a)return;
  const prev=a.status||"pending";
  const charName=a.character_name||a.characterName||"Unknown";
  const discordTarget=a.discord_id||a.discord_username||a.discord;

  const res=await mlUpdateAppStatus(a.id,status);
  if(res && res.ok !== false){
    if(status==="accepted"){
      await mlAddNotification(discordTarget,ML_NOTIF_TYPES.APPROVED,"Police application approved","Your Police application has been approved.");
      await mlAddNotification(discordTarget,ML_NOTIF_TYPES.DEPT_ACCEPTED,"Welcome to Police","You are now accepted into the Police department.");
    }else if(status==="rejected"){
      await mlAddNotification(discordTarget,ML_NOTIF_TYPES.REJECTED,"Police application rejected","Your Police application was not accepted this time.");
    }
    await mlLog("Police",`Status changed: ${prev} → ${status}`,charName,`Discord: ${discordTarget||"—"}`);
    await render("all");
  }else{
    alert("Failed to update status: "+(res?.error||"Unknown error"));
  }
}
</script>
